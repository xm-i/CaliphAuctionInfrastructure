name: Provision Infrastructure

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    paths:
      - 'ansible/**'
      - '.github/workflows/provision.yml'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible & collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}


      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BECOME_PASSWORD: ${{ secrets.BECOME_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          cd ansible
          # Secretsから取得したIPをansible_hostとして渡す
          EXTRA_VARS="postgres_password=${POSTGRES_PASSWORD} ansible_host=${SERVER_IP}"
          
          if [ -n "${BECOME_PASSWORD}" ]; then
            echo "Using become password from secret."
            EXTRA_VARS="$EXTRA_VARS ansible_become_pass=${BECOME_PASSWORD}"
          fi
          
          ansible-playbook -i inventory/hosts.ini site.yml -e "$EXTRA_VARS"

      - name: Finish
        run: echo "Provision finished"
